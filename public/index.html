<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Claude Code usage</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <div class="sidebar-head">
          <a class="brand" href="/overview">Claude Code usage</a>
          <button class="icon-button" id="sidebar-close" type="button" aria-label="Hide sidebar" aria-controls="sidebar">
            <span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span>
          </button>
        </div>
        <nav class="nav" id="nav" aria-label="Pages"></nav>
        <div class="recents">
          <h2 class="section-label" id="recents-title">Conversations by project</h2>
          <input class="input sidebar-search" id="recents-search" type="search" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off" spellcheck="false">
          <div class="recents-body scroll-area" id="recents-body" aria-labelledby="recents-title"></div>
        </div>
        <div class="sidebar-foot">
          <p class="scan-line" id="scan-line" role="status" hidden></p>
          <nav class="foot-nav" id="foot-nav" aria-label="Settings"></nav>
        </div>
      </aside>
      <div class="backdrop" id="backdrop" hidden></div>
      <div class="main" id="main">
        <header class="topbar">
          <button class="icon-button" id="sidebar-open" type="button" aria-label="Show sidebar" aria-controls="sidebar">
            <span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span>
          </button>
          <span class="topbar-title" id="topbar-title">Claude Code usage</span>
        </header>
        <div class="scroller scroll-area" id="scroller">
          <main class="content" id="content" tabindex="-1"></main>
          <footer class="footnote">Tokens are counted from the transcripts Claude Code saves on this computer, plus Claude Code's own total when it has saved one.</footer>
        </div>
      </div>
    </div>
  </body>
</html>
